<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>一键闪避</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1223;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh;overflow:hidden}#game{width:min(94vw,480px);height:min(92vh,800px);background:linear-gradient(#171b38,#0d1023);border:2px solid #30385f;border-radius:20px;position:relative;overflow:hidden;touch-action:none;box-shadow:0 15px 60px #0008}header{position:absolute;top:18px;width:100%;text-align:center;font-weight:700;font-size:20px;z-index:2}.hint{position:absolute;left:0;right:0;top:48%;text-align:center;color:#b8bed7;line-height:2;z-index:2}.hint b{display:block;font-size:23px;color:#fff}.item{position:absolute;transform:translate(-50%,-50%)}.star{color:#ffd34a;font-size:30px;text-shadow:0 0 16px #ffd34a}.bad{width:35px;height:35px;background:#ff4e5b;border-radius:8px;box-shadow:0 0 18px #ff4e5b88}.player{position:absolute;width:44px;height:44px;border-radius:50%;background:#4fb8ff;box-shadow:0 0 20px #4fb8ff99;transform:translate(-50%,-50%);z-index:1}.player:after{content:"";position:absolute;width:12px;height:12px;left:8px;top:7px;border-radius:50%;background:#b4ebff}.tip{position:absolute;bottom:13px;width:100%;text-align:center;color:#767eaa;font-size:12px}#graze{position:absolute;top:80px;width:100%;text-align:center;color:#ffe45b;font-weight:700;pointer-events:none;opacity:0;transition:opacity .15s}.ring{position:absolute;width:44px;height:44px;border:3px solid #ffe45b;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:ring .55s ease-out forwards;z-index:3}@keyframes ring{from{opacity:1;transform:translate(-50%,-50%) scale(.5)}to{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}button{background:#30385f;color:#fff;border:0;border-radius:8px;padding:6px 9px;margin-left:8px}</style></head><body><main id="game"><header>分数 <span id="score">0</span>　最高 <span id="best">0</span>　生命 <span id="lives">❤❤❤</span><button id="pause">暂停</button></header><div id="graze"></div><div class="hint" id="hint"><b>一键闪避</b>手指按下任意位置后移动：手指怎么动，小球怎么动；松手后会有惯性；接星星、躲红块<br>点击屏幕开始</div><div class="player" id="player"></div><div class="tip">按住鼠标或手指拖动蓝点</div></main><script>
const board=document.querySelector('#game'),player=document.querySelector('#player'),hint=document.querySelector('#hint'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),livesEl=document.querySelector('#lives'),pauseBtn=document.querySelector('#pause');
let grazeEl=document.querySelector('#graze'),W,H,x,y,lastTouchX=0,lastTouchY=0,vx=0,vy=0,items=[],score=0,pace=0,best=+localStorage.pixelCatBest||0,lives=3,combo=0,playing=false,paused=false,last=0,spawn=0,level=1,drag=false,grazeText='';
bestEl.textContent=best;
function resize(){W=board.clientWidth;H=board.clientHeight;if(!playing){x=W/2;y=H-130}place()}
function place(){player.style.left=x+'px';player.style.top=y+'px'}
function hearts(){livesEl.textContent='❤'.repeat(lives)+'♡'.repeat(3-lives)}
function start(){playing=true;paused=false;score=0;pace=0;vx=0;vy=0;lives=3;combo=0;level=1;items=[];hint.style.display='none';pauseBtn.textContent='暂停';last=performance.now();spawn=0;document.querySelectorAll('.item').forEach(e=>e.remove());hearts();requestAnimationFrame(loop)}
function add(){let roll=Math.random(),star=roll<.3,shield=!star&&roll>.94,e=document.createElement('i');e.className='item '+(star?'star':shield?'shield':'bad');e.textContent=star?'★':shield?'✦':'';let i={x:30+Math.random()*(W-60),y:-30,r:star?14:shield?16:19,star,shield,graze:false,e};e.style.left=i.x+'px';e.style.top=i.y+'px';board.append(e);items.push(i)}
function flashGraze(){grazeEl.textContent='擦弹 +1';grazeEl.style.opacity=1;let ring=document.createElement('i');ring.className='ring';ring.style.left=x+'px';ring.style.top=y+'px';board.append(ring);setTimeout(()=>ring.remove(),600);setTimeout(()=>grazeEl.style.opacity=0,700)}
function loseLife(){lives--;combo=0;hearts();if(lives<=0){playing=false;best=Math.max(best,score);localStorage.pixelCatBest=best;bestEl.textContent=best;hint.innerHTML='<b>游戏结束</b>得分 '+score+'　点击重新开始';hint.style.display='block';return true}return false}
function loop(t){if(!playing)return;if(paused){requestAnimationFrame(loop);return}let dt=Math.min(.04,(t-last)/1000);last=t;level=1+Math.floor(pace/10);let speed=180+level*22;vx*=Math.pow(.12,dt);vy*=Math.pow(.12,dt);x+=vx*dt;y+=vy*dt;x=Math.max(24,Math.min(W-24,x));y=Math.max(90,Math.min(H-42,y));place();for(let i of items)i.y+=(i.star?speed*.7:speed)*dt;for(let n=items.length-1;n>=0;n--){let i=items[n];i.e.style.top=i.y+'px';let d=Math.hypot(i.x-x,i.y-y);if(d<i.r+22){if(i.star){score+=1+Math.floor(combo/4);pace++;combo++;scoreEl.textContent=score;i.e.remove();items.splice(n,1)}else if(i.shield){player.style.boxShadow='0 0 30px #ffe45b';setTimeout(()=>player.style.boxShadow='',2200);i.e.remove();items.splice(n,1)}else{if(loseLife()){return}i.e.remove();items.splice(n,1)}}else if(!i.star&&!i.shield&&!i.graze&&i.y>y&&d<i.r+48){i.graze=true;score+=1;combo++;scoreEl.textContent=score;flashGraze()}else if(i.y>H+50){i.e.remove();items.splice(n,1)}}if(t-spawn>Math.max(230,700-level*35)){spawn=t;add()}requestAnimationFrame(loop)}
function moveAbsolute(e){let r=board.getBoundingClientRect();x=Math.max(24,Math.min(W-24,e.clientX-r.left));y=Math.max(90,Math.min(H-42,e.clientY-r.top));place()}
function moveRelative(e){let r=board.getBoundingClientRect(),nx=e.clientX-r.left,ny=e.clientY-r.top,rawDx=nx-lastTouchX,rawDy=ny-lastTouchY;if(Math.abs(rawDx)>45||Math.abs(rawDy)>45){lastTouchX=nx;lastTouchY=ny;return}let dx=Math.max(-28,Math.min(28,rawDx)),dy=Math.max(-28,Math.min(28,rawDy));x=Math.max(24,Math.min(W-24,x+dx));y=Math.max(90,Math.min(H-42,y+dy));vx=Math.max(-250,Math.min(250,vx+dx*2));vy=Math.max(-250,Math.min(250,vy+dy*2));lastTouchX=nx;lastTouchY=ny;place()}
board.addEventListener('pointerdown',e=>{e.preventDefault();if(!playing){start()}let r=board.getBoundingClientRect();lastTouchX=e.clientX-r.left;lastTouchY=e.clientY-r.top;vx=0;vy=0;drag=true;board.setPointerCapture(e.pointerId)});board.addEventListener('pointermove',e=>{e.preventDefault();if(drag)moveRelative(e)});board.addEventListener('pointerup',e=>{e.preventDefault();drag=false});board.addEventListener('pointercancel',()=>drag=false);pauseBtn.addEventListener('pointerdown',e=>{e.stopPropagation();if(playing){paused=!paused;pauseBtn.textContent=paused?'继续':'暂停'}});window.addEventListener('resize',resize);resize();
</script></body></html>
