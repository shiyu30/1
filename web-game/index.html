<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>一键闪避</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1223;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh;overflow:hidden}#game{width:min(94vw,480px);height:min(92vh,800px);background:linear-gradient(#171b38,#0d1023);border:2px solid #30385f;border-radius:20px;position:relative;overflow:hidden;touch-action:none;box-shadow:0 15px 60px #0008}header{position:absolute;top:18px;width:100%;text-align:center;font-weight:700;font-size:20px;z-index:2}.hint{position:absolute;left:0;right:0;top:48%;text-align:center;color:#b8bed7;line-height:2;z-index:2}.hint b{display:block;font-size:23px;color:#fff}.item{position:absolute;transform:translate(-50%,-50%)}.star{color:#ffd34a;font-size:30px;text-shadow:0 0 16px #ffd34a}.bad{width:35px;height:35px;background:#ff4e5b;border-radius:8px;box-shadow:0 0 18px #ff4e5b88}.player{position:absolute;width:44px;height:44px;border-radius:50%;background:#4fb8ff;box-shadow:0 0 20px #4fb8ff99;transform:translate(-50%,-50%);z-index:1}.player:after{content:"";position:absolute;width:12px;height:12px;left:8px;top:7px;border-radius:50%;background:#b4ebff}.tip{position:absolute;bottom:13px;width:100%;text-align:center;color:#767eaa;font-size:12px}</style></head><body><main id="game"><header>分数 <span id="score">0</span>　最高 <span id="best">0</span></header><div class="hint" id="hint"><b>一键闪避</b>拖动蓝点接星星，躲开红块<br>点击屏幕开始</div><div class="player" id="player"></div><div class="tip">按住鼠标或手指拖动蓝点</div></main><script>
const board=document.querySelector('#game'),player=document.querySelector('#player'),hint=document.querySelector('#hint'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let W,H,x,y,items=[],score=0,best=+localStorage.pixelCatBest||0,playing=false,last=0,spawn=0,drag=false;bestEl.textContent=best;
function resize(){W=board.clientWidth;H=board.clientHeight;if(!playing){x=W/2;y=H-130}place()}function place(){player.style.left=x+'px';player.style.top=y+'px'}function start(){playing=true;score=0;items=[];hint.style.display='none';last=performance.now();spawn=0;document.querySelectorAll('.item').forEach(e=>e.remove());requestAnimationFrame(loop)}function add(){let star=Math.random()<.28,e=document.createElement('i');e.className='item '+(star?'star':'bad');e.textContent=star?'★':'';let i={x:30+Math.random()*(W-60),y:-30,r:star?14:19,star,e};e.style.left=i.x+'px';e.style.top=i.y+'px';board.append(e);items.push(i)}function loop(t){if(!playing)return;let dt=Math.min(.04,(t-last)/1000);last=t;let speed=180+score*7;for(let i of items)i.y+=(i.star?speed*.7:speed)*dt;for(let n=items.length-1;n>=0;n--){let i=items[n];i.e.style.top=i.y+'px';let d=Math.hypot(i.x-x,i.y-y);if(d<i.r+22){if(i.star){score++;scoreEl.textContent=score;i.e.remove();items.splice(n,1)}else{playing=false;best=Math.max(best,score);localStorage.pixelCatBest=best;bestEl.textContent=best;hint.innerHTML='<b>撞到了！</b>得分 '+score+'　点击重新开始';hint.style.display='block';return}}else if(i.y>H+50){i.e.remove();items.splice(n,1)}}if(t-spawn>Math.max(260,720-score*8)){spawn=t;add()}requestAnimationFrame(loop)}function move(e){let r=board.getBoundingClientRect();x=Math.max(24,Math.min(W-24,e.clientX-r.left));y=Math.max(90,Math.min(H-42,e.clientY-r.top));place()}board.addEventListener('pointerdown',e=>{if(!playing)start();drag=true;board.setPointerCapture(e.pointerId);move(e)});board.addEventListener('pointermove',e=>{if(drag)move(e)});board.addEventListener('pointerup',()=>drag=false);window.addEventListener('resize',resize);resize();
</script></body></html>
